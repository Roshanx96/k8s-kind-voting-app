apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-user
  namespace: kubernetes-dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: admin-user
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: admin-user
  namespace: kubernetes-dashboard
- kind: ServiceAccount
  name: sam-user
  namespace: kubernetes-dashboard
- kind: ServiceAccount
  name: cdd-user
  namespace: kubernetes-dashboard
- kind: ServiceAccount
  name: ifm-user
  namespace: kubernetes-dashboard
- kind: ServiceAccount
  name: wlf-user
  namespace: kubernetes-dashboard
